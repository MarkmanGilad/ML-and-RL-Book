<text x='42' y='122' font-size='14.5' fill='#153b56' font-family="Consolas, 'Courier New', monospace" xml:space='preserve'>a = 5</text>
<text x='42' y='146' font-size='14.5' fill='#153b56' font-family="Consolas, 'Courier New', monospace" xml:space='preserve'>print("main head:", a)</text>
<text x='42' y='170' font-size='14.5' fill='#2e8b57' font-family="Consolas, 'Courier New', monospace" xml:space='preserve'>f1(a + 1)</text>
