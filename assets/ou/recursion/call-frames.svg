<text x='880' y='30' direction='rtl' text-anchor='start' font-size='15' font-weight='bold' fill='#153b56' font-family='Arial, Helvetica, sans-serif'>לכל קריאה סביבת עבודה משלה: המשתנה a של main, של f1 ושל f2 הם שלושה משתנים שונים</text>
