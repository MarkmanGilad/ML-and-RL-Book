<text x='342' y='212' font-size='14.5' fill='#153b56' font-family="Consolas, 'Courier New', monospace" xml:space='preserve'>a = 6</text>
<text x='342' y='236' font-size='14.5' fill='#153b56' font-family="Consolas, 'Courier New', monospace" xml:space='preserve'>print("f1 head:", a)</text>
