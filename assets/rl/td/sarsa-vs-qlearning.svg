<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="790" viewBox="0 0 1020 790" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#153b56"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="790" fill="#fff"/>
  <rect x="14" y="18" width="120" height="40" fill="#d9dde3"/>
  <text x="74" y="45" text-anchor="middle" font-size="19" fill="#1f2937">Q-learning:</text>
  <rect x="514" y="18" width="120" height="40" fill="#d9dde3"/>
  <text x="574" y="45" text-anchor="middle" font-size="19" fill="#1f2937">SARSA:</text>
  <line x1="510" y1="70" x2="510" y2="780" stroke="#ccd7df" stroke-width="1" stroke-dasharray="6 6"/>
<ellipse cx="260" cy="40" rx="48" ry="22" fill="#fff" stroke="#153b56" stroke-width="1.6"/><text x="260" y="45" text-anchor="middle" font-size="14" fill="#1f2937">Start</text>
<line x1="260" y1="62" x2="260" y2="88" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="90" width="360" height="40" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="260" y="115.0" text-anchor="middle" font-size="14" fill="#1f2937">Initialize random Q values</text>
<line x1="260" y1="130" x2="260" y2="158" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="160" width="360" height="40" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="260" y="185.0" text-anchor="middle" font-size="14" fill="#1f2937">Start the episode</text>
<line x1="260" y1="200" x2="260" y2="228" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="230" width="360" height="56" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="260" y="254.5" text-anchor="middle" font-size="14" fill="#1f2937">Choose the action a in state s</text>
<text x="260" y="271.5" text-anchor="middle" font-size="14" fill="#1f2937">using epsilon-greedy policy</text>
<line x1="260" y1="286" x2="260" y2="314" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="316" width="360" height="56" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="260" y="340.5" text-anchor="middle" font-size="14" fill="#1f2937">Perform that action, move to the next</text>
<text x="260" y="357.5" text-anchor="middle" font-size="14" fill="#1f2937">state s&#39; and receive reward r</text>
<line x1="260" y1="372" x2="260" y2="400" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="402" width="360" height="72" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="260" y="426.0" text-anchor="middle" font-size="14" fill="#1f2937">Update Q value of the previous state by</text>
<text x="90.79999999999998" y="443.0" font-family="Consolas, 'Courier New', monospace" font-size="12" textLength="338.40000000000003" lengthAdjust="spacingAndGlyphs" fill="#1f2937">Q(s,a) = Q(s,a) + alpha [ r + gamma max Q(s&#39;,a)</text>
<rect x="303.79999999999995" y="430.0" width="128.4" height="18" fill="none" stroke="#c8102e" stroke-width="1.8" rx="2"/>
<text x="224.0" y="460.0" font-family="Consolas, 'Courier New', monospace" font-size="12" textLength="72.0" lengthAdjust="spacingAndGlyphs" fill="#1f2937">- Q(s,a) ]</text>
<line x1="260" y1="474" x2="260" y2="502" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="260,504 378,556 260,608 142,556" fill="#fff" stroke="#153b56" stroke-width="1.6"/><text x="260" y="561" text-anchor="middle" font-size="14" fill="#1f2937">If s' is a terminal state</text>
<line x1="260" y1="608" x2="260" y2="650" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="272" y="648" font-size="14" fill="#1f2937">Yes</text>
<ellipse cx="260" cy="674" rx="48" ry="22" fill="#fff" stroke="#153b56" stroke-width="1.6"/><text x="260" y="679" text-anchor="middle" font-size="14" fill="#1f2937">End</text>
<polyline points="142,556 40.0,556 40.0,258 78.0,258" fill="none" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="14.0" y="407.0" font-size="14" fill="#1f2937">No</text>
<ellipse cx="760" cy="40" rx="48" ry="22" fill="#fff" stroke="#153b56" stroke-width="1.6"/><text x="760" y="45" text-anchor="middle" font-size="14" fill="#1f2937">Start</text>
<line x1="760" y1="62" x2="760" y2="88" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="90" width="360" height="40" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="760" y="115.0" text-anchor="middle" font-size="14" fill="#1f2937">Initialize random Q values</text>
<line x1="760" y1="130" x2="760" y2="158" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="160" width="360" height="40" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="760" y="185.0" text-anchor="middle" font-size="14" fill="#1f2937">Start the episode</text>
<line x1="760" y1="200" x2="760" y2="228" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="230" width="360" height="56" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="760" y="254.5" text-anchor="middle" font-size="14" fill="#1f2937">Choose the action a in state s</text>
<text x="760" y="271.5" text-anchor="middle" font-size="14" fill="#1f2937">using epsilon-greedy policy</text>
<line x1="760" y1="286" x2="760" y2="314" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="316" width="360" height="56" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="760" y="340.5" text-anchor="middle" font-size="14" fill="#1f2937">Perform that action, move to the next</text>
<text x="760" y="357.5" text-anchor="middle" font-size="14" fill="#1f2937">state s&#39; and receive reward r</text>
<line x1="760" y1="372" x2="760" y2="400" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="402" width="360" height="56" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="760" y="426.5" text-anchor="middle" font-size="14" fill="#1f2937">Choose the action a&#39; in the next state s&#39;</text>
<text x="760" y="443.5" text-anchor="middle" font-size="14" fill="#1f2937">using epsilon-greedy policy</text>
<ellipse cx="760" cy="430" rx="200" ry="44" fill="none" stroke="#c8102e" stroke-width="2.4"/>
<line x1="760" y1="458" x2="760" y2="486" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="488" width="360" height="72" fill="#fff" stroke="#153b56" stroke-width="1.6"/>
<text x="760" y="512.0" text-anchor="middle" font-size="14" fill="#1f2937">Update Q value of the previous state by</text>
<text x="601.6" y="529.0" font-family="Consolas, 'Courier New', monospace" font-size="12" textLength="316.8" lengthAdjust="spacingAndGlyphs" fill="#1f2937">Q(s,a) = Q(s,a) + alpha [ r + gamma Q(s&#39;,a&#39;)</text>
<rect x="814.6" y="516.0" width="106.8" height="18" fill="none" stroke="#c8102e" stroke-width="1.8" rx="2"/>
<text x="724.0" y="546.0" font-family="Consolas, 'Courier New', monospace" font-size="12" textLength="72.0" lengthAdjust="spacingAndGlyphs" fill="#1f2937">- Q(s,a) ]</text>
<line x1="760" y1="560" x2="760" y2="588" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="760,590 878,642 760,694 642,642" fill="#fff" stroke="#153b56" stroke-width="1.6"/><text x="760" y="647" text-anchor="middle" font-size="14" fill="#1f2937">If s' is a terminal state</text>
<line x1="760" y1="694" x2="760" y2="736" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="772" y="734" font-size="14" fill="#1f2937">Yes</text>
<ellipse cx="760" cy="760" rx="48" ry="22" fill="#fff" stroke="#153b56" stroke-width="1.6"/><text x="760" y="765" text-anchor="middle" font-size="14" fill="#1f2937">End</text>
<polyline points="642,642 540.0,642 540.0,258 578.0,258" fill="none" stroke="#153b56" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="514.0" y="450.0" font-size="14" fill="#1f2937">No</text>
</svg>
